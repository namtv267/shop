global:
  scrape_interval: 1s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [product:8082]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order:8083]
#  - job_name: alertmanager
#    static_configs:
#      - targets: [alertmanager:9093]