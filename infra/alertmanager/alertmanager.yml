route:
  receiver: 'default'
  group_by: ['alertname','job']
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 10m
  routes:
    - matchers:
        - severity="critical"
      receiver: 'slack'
      continue: true
    - matchers:
        - severity="critical"
      receiver: 'default'
receivers:
  - name: 'default'
    email_configs:
      - to: alertto@microshop.local
        from: alertfrom@microshop.local
        smarthost: maildev:1025
        require_tls: false

  - name: 'slack'
    slack_configs:
      - send_resolved: true
        api_url: https://hooks.slack.com/services/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
        channel: '#all-alert-example'          # có thể để trống nếu webhook đã gắn kênh
        title: '{{ .CommonAnnotations.summary }}'
        text: >-
          *Alert:* {{ .CommonLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *Details:* {{ range .Alerts }} - {{ .Annotations.description }} {{ end }}