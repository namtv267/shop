services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.2   # nên pin version, tránh :latest
    container_name: kc-test
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev", "--http-port=8080", "--hostname-strict=false"]
    restart: unless-stopped
