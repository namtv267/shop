version: "3.8"

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
  monitoring:
    driver: overlay

volumes:
  mongo_data:
  postgres_data:
  prometheus_data:
  grafana_data:

configs:
  prometheus.yml:
    file: ./infra/prometheus/prometheus.yml

services:
